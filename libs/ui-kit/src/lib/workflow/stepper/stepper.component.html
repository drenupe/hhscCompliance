<nav [class]="hostClasses.join(' ')" aria-label="Workflow progress">
  <ng-content select="[workflow-header]"></ng-content>

  @if (showHeader) {
    <header class="stepper__header">
      <div class="stepper__header-copy">
        @if (title) {
          <h2 class="stepper__heading">{{ title }}</h2>
        }

        @if (subtitle) {
          <p class="stepper__subtitle">{{ subtitle }}</p>
        }
      </div>

      <div class="stepper__meta">
        <span>{{ currentStepLabel }}</span>
        <strong>{{ progressLabel }}%</strong>
      </div>
    </header>
  }

  <ng-content select="[workflow-toolbar]"></ng-content>

  @if (showProgress) {
    <div class="stepper__progress" aria-hidden="true">
      <span [style.width.%]="progressPercent()"></span>
    </div>
  }

  <ng-content select="[workflow-before-steps]"></ng-content>

  <ol class="stepper__list">
    @for (step of steps; track step.id; let index = $index) {
      <li [class]="getStepClasses(step, index).join(' ')">
        <button
          class="stepper__button"
          type="button"
          [disabled]="!canSelectStep(step, index)"
          [attr.aria-current]="step.id === currentStepId ? 'step' : null"
          [attr.title]="getStepTooltip(step, index)"
          (click)="selectStep(step, index)"
        >
          <span class="stepper__marker">
            @if (getMarkerLabel(step, index)) {
              <span class="stepper__marker-label">
                {{ getMarkerLabel(step, index) }}
              </span>
            } @else {
              <span class="stepper__dot"></span>
            }
          </span>

          <span class="stepper__content">
            <span class="stepper__title">
              {{ step.title }}
            </span>

            @if (step.badge) {
              <span class="stepper__badge">
                {{ step.badge }}
              </span>
            }

            @if (showDescriptions && step.description) {
              <span class="stepper__description">
                {{ step.description }}
              </span>
            }
          </span>
        </button>

        @if (index < steps.length - 1) {
          <span
            [class]="getConnectorClasses(index).join(' ')"
            aria-hidden="true"
          ></span>
        }
      </li>
    }
  </ol>

  <ng-content select="[workflow-after-steps]"></ng-content>

  <ng-content></ng-content>

  <ng-content select="[workflow-actions]"></ng-content>

  <ng-content select="[workflow-footer]"></ng-content>
</nav>
