<section class="module-workbench">
  <button type="button" class="back-btn" (click)="goBack()">
    ← Back to Dashboard
  </button>

  <section *ngIf="loading" class="state-card">
    Loading module...
  </section>

  <section *ngIf="error" class="state-card state-card--error">
    {{ error }}
  </section>

  <ng-container *ngIf="!loading && !error && data as workbench">
    <header class="module-workbench__header">
      <div>
        <h1>{{ workbench.title || workbench.module }}</h1>
        <p>
          {{ workbench.totalFindings }} findings across
          {{ workbench.totalAreas }} correction areas.
        </p>
      </div>
    </header>

    <section class="entity-selector">
      <h2>Affected Locations</h2>

      <button
        type="button"
        class="entity-chip"
        *ngFor="let entity of affectedEntities"
        (click)="openEntity(entity)"
      >
        <strong>{{ entity.entityLabel }}</strong>
        <span>{{ entity.findingCount }} findings</span>
      </button>
    </section>

    <section class="areas">
      <h2>Correction Areas</h2>

      <button
        type="button"
        class="area-card"
        *ngFor="let area of workbench.areas"
        (click)="openCorrectionArea(area)"
      >
        <div>
          <h3>{{ area.title }}</h3>

          <p>
            {{ area.findingCount }} findings
            <span *ngIf="area.criticalCount">
              · {{ area.criticalCount }} critical
            </span>
            <span *ngIf="area.highCount">
              · {{ area.highCount }} high
            </span>
            <span *ngIf="area.mediumCount">
              · {{ area.mediumCount }} medium
            </span>
          </p>
        </div>

        <span class="area-card__action">
          Open Correction Workspace →
        </span>
      </button>
    </section>
  </ng-container>
</section>
