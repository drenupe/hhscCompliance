<section class="dash">
  <header class="dash__header">
    <div>
      <h2>Compliance Dashboard</h2>
      <p>
        Provider-wide view of compliance modules requiring attention. Click a
        module to correct out-of-compliance items.
      </p>
    </div>
  </header>

  <div class="msg" *ngIf="message">
    {{ message }}
  </div>

  <div class="msg" *ngIf="loadingData">
    Loading compliance dashboard...
  </div>

  <section class="dash__grid" *ngIf="!loadingData">
    <lib-compliance-summary-card
      *ngFor="let s of summaryData"
      [summary]="s"
      (viewDetails)="navigateTo($event)"
    ></lib-compliance-summary-card>
  </section>

  <section class="dash__alert" *ngIf="hasUrgentAlerts">
    <div class="alert">
      <strong>Critical issues:</strong>
      <ul>
        <li *ngFor="let a of alerts">⚠️ {{ a }}</li>
      </ul>
    </div>
  </section>


</section>
