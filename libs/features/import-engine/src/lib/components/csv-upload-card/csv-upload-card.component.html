<lib-card
  [appearance]="template.uploaded ? 'elevated' : 'outlined'"
  padding="md"
  radius="lg"
  [interactive]="!disabled"
>
  <div card-header>
    <div>
      <h3 card-title>{{ template.name }}</h3>

      <span [class]="statusClass">
        {{ template.status }}
      </span>
    </div>

    @if (template.uploaded) {
      <div class="upload-card__check">
        ✓
      </div>
    }
  </div>

  <p card-subtitle>
    {{ template.description }}
  </p>

  <section class="upload-card__details">
    <div class="detail">
      <span class="detail__title">Expected File</span>
      <strong>{{ template.expectedFileName }}</strong>
    </div>

    @if (template.uploaded) {
      <div class="detail">
        <span class="detail__title">Records Found</span>
        <strong>{{ template.recordsFound || 0 }}</strong>
      </div>
    }
  </section>

  <div card-actions>
    <button
      class="btn btn--secondary"
      type="button"
      [disabled]="disabled"
      (click)="onDownloadTemplate()"
    >
      Download Template
    </button>

    <input
      class="upload-card__input"
      type="file"
      accept=".csv,text/csv"
      [id]="inputId"
      [disabled]="disabled"
      (change)="onFileSelected($event)"
    />

    <label
      class="btn btn--primary"
      [class.btn--disabled]="disabled"
      [for]="inputId"
    >
      {{ buttonLabel }}
    </label>

    @if (template.uploaded) {
      <button
        class="btn btn--secondary"
        type="button"
        [disabled]="disabled"
        (click)="onRemove()"
      >
        Remove
      </button>
    }
  </div>
</lib-card>
