<lib-card
  class="upload-card"
  [appearance]="template.uploaded ? 'elevated' : 'outlined'"
  padding="sm"
  radius="lg"
  [interactive]="!disabled"
>
  <div card-header>
    <div class="upload-card__title-group">
      <div class="upload-card__title-row">
        <span class="upload-card__icon" aria-hidden="true">
          {{ template.uploaded ? '✓' : 'CSV' }}
        </span>

        <h3 card-title>{{ template.name }}</h3>
      </div>

      <span [class]="statusClass">
        {{ statusLabel }}
      </span>
    </div>
  </div>

  <div class="upload-card__body">
    <div class="upload-card__file">
      <span>Expected file</span>
      <strong>{{ template.expectedFileName }}</strong>
    </div>

    @if (template.uploaded) {
      <div class="upload-card__records">
        {{ recordsLabel }} found
      </div>
    } @else {
      <p class="upload-card__description">
        {{ template.description }}
      </p>
    }
  </div>

  <input
    #fileInput
    class="upload-card__input"
    type="file"
    accept=".csv,text/csv"
    [disabled]="disabled"
    (change)="onFileSelected($event)"
  />

  <div card-actions>
    <button
      class="btn btn--secondary"
      type="button"
      [disabled]="disabled"
      (click)="onDownloadTemplate()"
    >
      Template
    </button>

    <button
      class="btn btn--primary"
      type="button"
      [disabled]="disabled"
      (click)="openFilePicker()"
    >
      {{ uploadLabel }}
    </button>

    @if (template.uploaded) {
      <button
        class="btn btn--ghost"
        type="button"
        [disabled]="disabled"
        (click)="onRemove()"
      >
        Remove
      </button>
    }
  </div>
</lib-card>
