<article
  class="upload-card"
  [class.upload-card--uploaded]="template.uploaded"
  [class.upload-card--disabled]="disabled"
>
  <header class="upload-card__header">
    <div>
      <h3>{{ template.name }}</h3>

      <span [class]="statusClass">
        {{ template.status }}
      </span>
    </div>

    <div
      class="upload-card__check"
      *ngIf="template.uploaded"
    >
      ✓
    </div>
  </header>

  <p class="upload-card__description">
    {{ template.description }}
  </p>

  <section class="upload-card__details">

    <div class="detail">
      <span class="detail__title">Expected File</span>
      <strong>{{ template.expectedFileName }}</strong>
    </div>

    <div
      class="detail"
      *ngIf="template.uploaded"
    >
     <span class="detail__title">Records Found</span>
      <strong>{{ template.recordsFound || 0 }}</strong>
    </div>

  </section>

  <footer class="upload-card__footer">

    <button
      class="btn btn--primary"
      type="button"
      [disabled]="disabled"
      (click)="onUpload()"
    >
      {{ buttonLabel }}
    </button>

    <button
      *ngIf="template.uploaded"
      class="btn btn--secondary"
      type="button"
      [disabled]="disabled"
      (click)="onRemove()"
    >
      Remove
    </button>

  </footer>
</article>
